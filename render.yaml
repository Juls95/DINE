# Static site. The browser never talks to Notion (CSP connect-src 'self').
# NOTION_TOKEN is a Render secret used only at build time by `pnpm beary:notion`.
# Deploys only after CI passes on main; pushing is the manual weekly review step.
services:
  - type: web
    name: near-rdc
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm beary:notion && pnpm bul:build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.21.1
      - key: DATA_MODE
        value: live
      # Hosted sign-up form, e.g. https://formspree.io/f/abcdwxyz. Public by design (it is shipped to the browser): not a secret.
      - key: SIGNUP_ENDPOINT
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_VERSION
        value: "2022-06-28"
      - key: NOTION_DB_TICKERS_INFO
        value: "99687de2-cbd0-4b2e-9e1c-0dd0a3211357"
      - key: NOTION_DB_X_CREATIVE
        value: "460be6fc-c001-4330-9832-c55f647c5c23"
      - key: NOTION_DB_X_ANALYSES
        value: "bbaf87b8-dfa1-4cce-acb3-f4f69a0c383d"
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://formspree.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
